name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:plugin
      - run: git archive --format=tar.gz --output=pocketid-agent-bootstrap-${{ github.ref_name }}.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: pocketid-agent-bootstrap-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
